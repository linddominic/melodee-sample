<div class="kits" id="kits">
  <section class="kit-side" aria-label="Kits">
    <div class="kit-bar">
      <input type="search" id="kit-search" placeholder="Search kits" aria-label="Search kits">
      <button type="button" id="kit-new">New kit</button>
    </div>
    <div class="kit-filter" role="group" aria-label="Show">
      <button type="button" class="seg" data-show="all" aria-pressed="true">All</button>
      <button type="button" class="seg" data-show="factory" aria-pressed="false">Factory</button>
      <button type="button" class="seg" data-show="mine" aria-pressed="false">My kits</button>
      <button type="button" class="seg" data-show="sd" aria-pressed="false">SD card</button>
    </div>
    <ul class="lanes kit-list" id="kit-list" aria-label="Kits"></ul>
  </section>
  <section class="kit-main" id="kit-main" aria-label="Kit">
    <div class="kit-empty" id="kit-none">Pick a kit, or make a new one. Kits you make are saved to
      <code>Melodee/Projects/Kits</code> on the card: load one on the MPC with <b>Project</b> → <b>Load kit</b>.</div>
    <div id="kit-open" hidden>
      <header class="kit-head">
        <div>
          <p class="label" id="kit-source"></p>
          <h1 id="kit-name"></h1>
          <p class="kit-sub" id="kit-sub"></p>
        </div>
        <div class="kit-acts">
          <button type="button" class="quiet" id="kit-dup">Duplicate</button>
          <button type="button" class="quiet" id="kit-rename">Rename</button>
          <button type="button" class="quiet danger" id="kit-delete">Delete</button>
        </div>
      </header>
      <ul class="kit-warn" id="kit-warn"></ul>
      <div class="banks" id="banks" role="group" aria-label="Bank"></div>
      <div class="pad-grid" id="pad-grid" aria-label="Pads"></div>
      <div class="pad-panel" id="pad-panel">
        <header class="pad-head">
          <div><p class="label" id="pad-label"></p><h2 id="pad-name"></h2></div>
          <button type="button" class="quiet danger" id="pad-clear">Clear pad</button>
        </header>
        <ul class="lanes layers" id="pad-layers"></ul>
        <div class="pad-params" id="pad-params"></div>
        <p class="say" id="pad-say"></p>
        <div class="picker" id="picker" hidden>
          <div class="picker-bar">
            <p class="label">Assign a sample</p>
            <div class="kit-filter" role="group" aria-label="Samples from">
              <button type="button" class="seg" data-source="sd" aria-pressed="true">SD card</button>
              <button type="button" class="seg" data-source="factory" aria-pressed="false">Factory</button>
            </div>
          </div>
          <nav class="crumbs" id="picker-crumbs" aria-label="Folder"></nav>
          <ul class="lanes picker-list" id="picker-list"></ul>
        </div>
      </div>
    </div>
  </section>
  <audio id="kit-player" preload="none"></audio>
</div>
